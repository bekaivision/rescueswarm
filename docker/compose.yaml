name: rescueswarm
services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: rescueswarm-dev:jazzy
    runtime: nvidia
    network_mode: host
    ipc: host
    working_dir: /workspace
    environment:
      - DISPLAY
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # PRIME offload: GLX и Vulkan через NVIDIA, окно показывает X-сервер на AMD
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
      - ROS_DOMAIN_ID=42
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # больше участников DDS на домен: 3 робота с Nav2 дают > 9 процессов
      - CYCLONEDDS_URI=file:///workspace/src/rs_bringup/config/cyclonedds.xml
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.docker.xauth:ro
      - gz-cache:/home/dev/.gz

volumes:
  gz-cache:
