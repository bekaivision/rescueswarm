# Nav2 для одного наземного робота. Подстановки при запуске (nav2.launch.py):
#   <robot_namespace> -> ground_i, <map_topic> -> топик карты (по умолчанию /map).
# Глобальный кадр: world. TF общий (/tf, /tf_static), в namespace его не переносим.
# Нужны только: planner, controller, behaviors, bt_navigator, lifecycle_manager.
bt_navigator:
  ros__parameters:
    global_frame: world
    robot_base_frame: <robot_namespace>/base_link
    odom_topic: odom            # относительный: /<ns>/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    transform_tolerance: 0.3
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: odom
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.14     # ориентация в цели не важна
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.6
      # false: у прямоугольного footprint RPP отказывает в зазорах, где планировщик (по центру) проходит
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.15
      use_fixed_curvature_lookahead: false
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <robot_namespace>/odom
      robot_base_frame: <robot_namespace>/base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.28, 0.17], [0.28, -0.17], [-0.28, -0.17], [-0.28, 0.17]]"
      plugins: ["obstacle_layer", "robots_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: lidar
        lidar:
          topic: /<robot_namespace>/lidar/points
          sensor_frame: <robot_namespace>/lidar_link
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.1     # земля (z~0) не считается препятствием
          max_obstacle_height: 1.2
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.2      # не видеть собственный корпус
          inf_is_valid: false
      robots_layer:
        # другие роботы: виртуальный скан по их истинным позам (rs_mapping/other_robots).
        # Свой слой, чтобы стирание лучами не трогало метки настоящего лидара.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: robots
        robots:
          topic: /<robot_namespace>/other_robots_scan
          sensor_frame: <robot_namespace>/base_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
          inf_is_valid: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: world
      robot_base_frame: <robot_namespace>/base_link
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.28, 0.17], [0.28, -0.17], [-0.28, -0.17], [-0.28, 0.17]]"
      plugins: ["static_layer", "obstacle_layer", "robots_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: <map_topic>
        map_subscribe_transient_local: True
        subscribe_to_updates: True
        # неизвестные клетки остаются неизвестными (без трактовки как свободных)
        trinary_costmap: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: lidar
        lidar:
          topic: /<robot_namespace>/lidar/points
          sensor_frame: <robot_namespace>/lidar_link
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.1
          max_obstacle_height: 1.2
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.2
          inf_is_valid: false
      robots_layer:
        # другие роботы: виртуальный скан по их истинным позам (rs_mapping/other_robots).
        # Свой слой, чтобы стирание лучами не трогало метки настоящего лидара.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: robots
        robots:
          topic: /<robot_namespace>/other_robots_scan
          sensor_frame: <robot_namespace>/base_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          raytrace_max_range: 7.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.5
          obstacle_min_range: 0.0
          inf_is_valid: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true      # границы исследования лежат в неизвестном пространстве

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: <robot_namespace>/odom
    global_frame: world
    robot_base_frame: <robot_namespace>/base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# Аварийная остановка по другим роботам, независимо от планировщика.
# Цепочка: controller/behaviors/explorer -> /<ns>/cmd_vel_nav -> collision_monitor -> /<ns>/cmd_vel.
# Источник только скан «другие роботы» (стены обрабатывают costmap, иначе робот у стены не сможет сдать назад).
# Зоны зависят от направления движения: так робот, уже оказавшийся рядом с другим, может отъехать.
# Размеры от корпуса 0.5 x 0.3 м: нужен запас, чтобы центры не сближались меньше 0.6 м.
collision_monitor:
  ros__parameters:
    base_frame_id: <robot_namespace>/base_link
    odom_frame_id: <robot_namespace>/odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["VelocityPolygonStop"]
    VelocityPolygonStop:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 1
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_polygon_stop"
      velocity_polygons: ["rotation", "translation_forward", "translation_backward", "stopped"]
      holonomic: false
      rotation:
        points: "[[0.36, 0.36], [0.36, -0.36], [-0.36, -0.36], [-0.36, 0.36]]"
        linear_min: -0.01
        linear_max: 0.01
        theta_min: -4.0
        theta_max: 4.0
      translation_forward:
        # впереди 0.8 м (торможение + запас), по бокам 0.42; у самого корпуса уже (0.3), чтобы рядом стоящий не блокировал
        points: "[[0.8, 0.42], [0.8, -0.42], [0.2, -0.42], [0.2, -0.3], [-0.1, -0.3], [-0.1, 0.3], [0.2, 0.3], [0.2, 0.42]]"
        linear_min: 0.01
        linear_max: 1.0
        theta_min: -4.0
        theta_max: 4.0
      translation_backward:
        points: "[[-0.8, 0.42], [-0.8, -0.42], [-0.2, -0.42], [-0.2, -0.3], [0.1, -0.3], [0.1, 0.3], [-0.2, 0.3], [-0.2, 0.42]]"
        linear_min: -1.0
        linear_max: -0.01
        theta_min: -4.0
        theta_max: 4.0
      stopped:
        points: "[[0.36, 0.36], [0.36, -0.36], [-0.36, -0.36], [-0.36, 0.36]]"
        linear_min: -1.0
        linear_max: 1.0
        theta_min: -4.0
        theta_max: 4.0
    observation_sources: ["robots"]
    robots:
      type: "scan"
      topic: /<robot_namespace>/other_robots_scan
      enabled: True
